name: Run Bot 24/7

on:
  schedule:
    - cron: '0 */6 * * *'   # каждые 6 часов
  workflow_dispatch:          # ручной запуск

# Не запускать несколько экземпляров одновременно (конфликт ngrok/Telegram)
concurrency:
  group: run-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355      # чуть меньше лимита GitHub (6 часов = 360 мин)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start ngrok tunnel
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          python3 -c "
          import os, time
          from pyngrok import ngrok, conf
          conf.get_default().auth_token = os.environ['NGROK_TOKEN']
          tunnel = ngrok.connect(8080, domain='relearn-whiff-pusher.ngrok-free.dev')
          print('ngrok connected:', tunnel.public_url)
          time.sleep(99999)
          " &
          sleep 5

      - name: Run bot (~6 hours, then workflow restarts it)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PAYMENT_SECRET: ${{ secrets.PAYMENT_SECRET }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          PDF_FILE_ID: ${{ secrets.PDF_FILE_ID }}
          COVER_FILE_ID: ${{ secrets.COVER_FILE_ID }}
          PUBLIC_URL: https://relearn-whiff-pusher.ngrok-free.dev
          WEBHOOK_PORT: '8080'
        run: timeout 21000 python main.py || true
